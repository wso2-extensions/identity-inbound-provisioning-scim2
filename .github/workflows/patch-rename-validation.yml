name: SCIM2 group PATCH rename validation

on:
  push:
    branches:
      - pr/group-patch-rename-only-is-7.3

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - name: Build and run tests
        run: mvn clean install -U -B
